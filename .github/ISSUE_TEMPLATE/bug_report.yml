name: Bug report
description: Report something that isn't working as expected
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Go to '...'
        2. Tap on '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen instead?
    validations:
      required: true

  - type: input
    id: app-version
    attributes:
      label: App version
      description: Found in the app, or the tag/commit you built from.
      placeholder: v1.2.0
    validations:
      required: true

  - type: input
    id: android-version
    attributes:
      label: Android version & device
      placeholder: Android 14, Pixel 7
    validations:
      required: true

  - type: dropdown
    id: grant-method
    attributes:
      label: How was WRITE_SECURE_SETTINGS granted?
      description: Scalara requires this permission to be granted manually. Many issues turn out to be a grant/setup problem rather than a bug — this helps us tell the difference quickly.
      options:
        - ADB (pm grant)
        - Shizuku
        - Other / not sure
        - Not granted yet
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste any relevant logcat output or stack trace. This will be automatically formatted as code.
      render: shell

  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Anything else that might help, e.g. screenshots.
