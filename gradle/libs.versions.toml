[versions]
agp = "9.3.1"
appcompat = "1.6.1"
constraintlayout = "2.1.4"
material = "1.14.0"
startupRuntime = "1.1.1"
interpolator = "1.0.0"
splashscreen = "1.2.0"
shizuku = "13.1.5"
recyclerview = "1.3.2"
lifecycle = "2.8.7"
gson = "2.11.0"

[libraries]
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
androidx-constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintlayout" }
androidx-startup-runtime = { group = "androidx.startup", name = "startup-runtime", version.ref = "startupRuntime" }
androidx-interpolator = { group = "androidx.interpolator", name = "interpolator", version.ref = "interpolator" }
